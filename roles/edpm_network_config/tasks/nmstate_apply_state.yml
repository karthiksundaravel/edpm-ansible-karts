---
# Apply one nmstate desired-state document via linux_system_roles.network.
# Caller sets edpm_nmstate_apply_template (YAML string), edpm_nmstate_apply_phase
# (label used in task names / temp file names), and optionally
# edpm_nmstate_apply_interface_mapping (nic alias -> Linux interface name dict,
# from the derived NIC mapping).

- name: Render network_state variable [nmstate {{ edpm_nmstate_apply_phase }}] (NIC aliases only under nmstate iface keys)
  ansible.builtin.set_fact:
    network_state: >-
      {{
        edpm_nmstate_apply_template
        | from_yaml
        | osp.edpm.edpm_substitute_nic_aliases(edpm_nmstate_apply_interface_mapping | default({}))
      }}

- name: Skip nmstate interfaces unavailable in sysfs (e.g. bound to vfio-pci) [nmstate {{ edpm_nmstate_apply_phase }}]
  when: edpm_network_config_nmstate_skip_unavailable_interfaces | bool
  block:
    - name: Write rendered network_state for unavailable-interface filtering [nmstate {{ edpm_nmstate_apply_phase }}]
      ansible.builtin.copy:
        content: "{{ network_state | to_nice_yaml }}"
        dest: "/var/lib/edpm-config/.nmstate_{{ edpm_nmstate_apply_phase }}_filter_in.yaml"
        mode: "0644"

    - name: Filter interfaces unavailable in sysfs using device_map [nmstate {{ edpm_nmstate_apply_phase }}]
      ansible.builtin.command:
        argv:
          - python3
          - "{{ role_path }}/files/edpm_nmstate_filter_unavailable.py"
          - -f
          - "/var/lib/edpm-config/.nmstate_{{ edpm_nmstate_apply_phase }}_filter_in.yaml"
          - -m
          - "{{ edpm_network_config_nmstate_device_map_file }}"
          - -o
          - "/var/lib/edpm-config/.nmstate_{{ edpm_nmstate_apply_phase }}_filter_out.yaml"
      register: edpm_nmstate_filter_result
      changed_when: false

    - name: Report interfaces skipped due to unavailability [nmstate {{ edpm_nmstate_apply_phase }}]
      ansible.builtin.debug:
        msg: "{{ edpm_nmstate_filter_result.stdout_lines }}"
      when: edpm_nmstate_filter_result.stdout | trim | length > 0

    - name: Read filtered network_state [nmstate {{ edpm_nmstate_apply_phase }}]
      ansible.builtin.slurp:
        path: "/var/lib/edpm-config/.nmstate_{{ edpm_nmstate_apply_phase }}_filter_out.yaml"
      register: edpm_nmstate_filtered_slurp

    - name: Use filtered network_state [nmstate {{ edpm_nmstate_apply_phase }}]
      ansible.builtin.set_fact:
        network_state: "{{ edpm_nmstate_filtered_slurp.content | b64decode | from_yaml }}"

- name: Load system-roles.network tasks [nmstate {{ edpm_nmstate_apply_phase }}]
  ansible.builtin.include_role:
    name: "{{ lookup('ansible.builtin.env', 'EDPM_SYSTEMROLES', default='fedora.linux_system_roles') + '.network' }}"
  register: edpm_nmstate_apply_result
